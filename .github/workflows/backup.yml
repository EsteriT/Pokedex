name: Encrypted backend backup

on:
  workflow_dispatch:
  schedule:
    # 02:23 in Vietnam. Avoid the top of the hour's scheduling congestion.
    - cron: "23 19 * * *"

permissions:
  contents: read

concurrency:
  group: backend-backup-production
  cancel-in-progress: false

jobs:
  backup:
    if: >-
      github.repository == 'EsteriT/Pokedex' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.BACKUPS_ENABLED == 'true')
    environment: backup-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Create, encrypt, upload and verify backup
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          POKEDEX_BACKUP_PASSPHRASE: ${{ secrets.POKEDEX_BACKUP_PASSPHRASE }}
          POKEDEX_BACKUP_SECRET_KEY: ${{ secrets.POKEDEX_BACKUP_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run backend:backup:auto
      - name: Report interrupted or early failure
        if: ${{ !success() }}
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: node scripts/backup-notify.cjs
