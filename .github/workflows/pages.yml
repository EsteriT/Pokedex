name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Build hosted binder website
        # These identify the public project. Google and administrator secrets stay in Supabase.
        env:
          POKEDEX_SUPABASE_URL: https://pnuovoogfjzzlgmenhnq.supabase.co
          POKEDEX_SUPABASE_PUBLISHABLE_KEY: sb_publishable_oy_dcf2l-eKy1torgp-t6w_p6F_btzk
        run: npm run build:pages
      - run: npm run check
      - run: npm test
      - run: npm run test:backend
      - run: npm run test:repository
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
